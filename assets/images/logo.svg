<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a1d"/>
      <stop offset="100%" stop-color="#041810"/>
    </linearGradient>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ecfdf5"/>
      <stop offset="70%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Premium Squircle Badge Base -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#logoBgGrad)" stroke="url(#ecoGrad)" stroke-width="2.5"/>

  <!-- Subtle Inner Ambient Mesh -->
  <circle cx="50" cy="50" r="34" fill="url(#ecoGrad)" fill-opacity="0.12"/>

  <!-- Aerodynamic Kinetic Mobility Arc -->
  <path d="M 24 54 C 24 33 38 22 58 22 C 73 22 81 32 79 45 C 77 58 64 66 48 66" stroke="url(#orbitGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- High-Voltage Precision Lightning Bolt -->
  <path d="M 55 18 L 33 49 L 48 49 L 43 80 L 69 44 L 54 44 Z" fill="url(#boltGrad)" filter="url(#glow)"/>

  <!-- Futuristic Pulse Node -->
  <circle cx="72" cy="70" r="6" fill="#00f5a0"/>
  <circle cx="72" cy="70" r="2.8" fill="#ffffff"/>
</svg>
